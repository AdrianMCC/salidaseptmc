<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cumpleaños de Richi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#efe4cf}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#000}
#hint{position:fixed;left:0;right:0;bottom:14px;padding:0 16px;text-align:center;font:500 13px/1.4 system-ui,sans-serif;color:var(--fg);opacity:.0;letter-spacing:.04em;transition:opacity .8s;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:12%;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px;transition:opacity .5s;opacity:0;pointer-events:none}
#ui button{font:400 22px/1 Anton,Impact,sans-serif;letter-spacing:.08em;color:#1a0505;background:linear-gradient(#ffe8a0,#f2b93a);border:0;border-radius:4px;padding:16px 34px;cursor:pointer;box-shadow:0 6px 30px rgba(255,180,60,.35),0 0 0 2px #7a0a0a inset;text-transform:uppercase}
#ui button.sec{font-size:15px;padding:11px 22px;color:var(--fg);background:rgba(20,6,6,.72);box-shadow:0 0 0 1px rgba(239,228,207,.35) inset;backdrop-filter:blur(6px)}
#ui button:disabled{opacity:.45;cursor:default}
#prog{min-height:18px;font:500 13px/1.4 system-ui,sans-serif;color:var(--fg);text-align:center;text-shadow:0 1px 6px #000}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"><button id="play">▶&nbsp; Reproducir</button><button id="exp" class="sec">Exportar MP4</button><div id="prog"></div></div>
<div id="hint">espacio: repetir &nbsp;·&nbsp; M: silencio &nbsp;·&nbsp; E: exportar &nbsp;·&nbsp; A: 9:16 / 16:9</div>
<script>
(()=>{
'use strict';
/* ============================================================
   CONFIG
   ============================================================ */
const Q=new URLSearchParams(location.search);
const ASPECT=Q.get('aspect')||'9x16';
const VERT=ASPECT!=='16x9';
const RES=Math.max(360,Math.min(2160,+(Q.get('res')||1080)));
const W=VERT?RES:Math.round(RES*16/9), H=VERT?Math.round(RES*16/9):RES;
const PX=Math.min(W,H)/1080;
const DUR=10;
const FREEZE=Q.has('t')?parseFloat(Q.get('t')):null;
const CLEAN=Q.has('clean')||FREEZE!==null;
const LOOP=Q.has('loop');
const TAU=Math.PI*2;
const STEP_HZ=0.92;

const cv=document.getElementById('cv'); cv.width=W; cv.height=H;
const ctx=cv.getContext('2d');
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
const LBG=mk(W,H),LFAR=mk(W,H),LMID=mk(W,H),TCAN=mk(W,H),BCAN=mk(W,H),BLM=mk(Math.round(W/4),Math.round(H/4));
const cBG=LBG.getContext('2d'),cFAR=LFAR.getContext('2d'),cMID=LMID.getContext('2d'),cT=TCAN.getContext('2d'),cB=BCAN.getContext('2d'),cBL=BLM.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

/* ============================================================
   HELPERS
   ============================================================ */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sq=x=>x*x;
const sstep=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x);};
const eOutC=x=>1-Math.pow(1-x,3);
const eOutBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=rng(20260910);
const rand=(a,b)=>a+(b-a)*R();
const pick=a=>a[(R()*a.length)|0];
function rgb(r,g,b,a){r=r<0?0:r>255?255:r|0;g=g<0?0:g>255?255:g|0;b=b<0?0:b>255?255:b|0;return a===undefined?`rgb(${r},${g},${b})`:`rgba(${r},${g},${b},${a<0?0:a>1?1:a.toFixed(3)})`;}
function hex(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function mixC(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
const cs=(c,a)=>rgb(c[0],c[1],c[2],a);

/* Lighting model: before = dim red key, after = warm party light. fz = fog amount */
const FOG0=[30,5,6],FOG1=[96,52,74];
function lightCol(c,k,m,fz){
  const r0=c[0]*0.2*k+5,g0=c[1]*0.105*k+2,b0=c[2]*0.11*k+3;
  const r1=c[0]*0.95*k+12,g1=c[1]*0.82*k+7,b1=c[2]*0.68*k+6;
  let r=r0+(r1-r0)*m,g=g0+(g1-g0)*m,b=b0+(b1-b0)*m;
  const fr=lerp(FOG0[0],FOG1[0],m),fg=lerp(FOG0[1],FOG1[1],m),fb=lerp(FOG0[2],FOG1[2],m);
  r+=(fr-r)*fz;g+=(fg-g)*fz;b+=(fb-b)*fz;
  return rgb(r,g,b);
}
const RIM0=[255,44,26],RIM1=[255,214,150];
const rimStr=(a,m)=>rgb(lerp(RIM0[0],RIM1[0],m),lerp(RIM0[1],RIM1[1],m),lerp(RIM0[2],RIM1[2],m),a);

/* ============================================================
   CAMERA
   ============================================================ */
const FOV=(VERT?40:26)*Math.PI/180;
const F0=(H/2)/Math.tan(FOV/2);
const cam={x:0,y:0,z:0,p:0,cp:1,sp:0,f:F0};
const KY=[[0,0.10,0.10],[4,1.60,0.42],[9,3.30,0.07],[10,3.36,0.05]];
const KP=[[0,0.0,0.0],[4,0.0,0.008],[9,0.088,0.004],[10,0.09,0.0]];
const KZ=[[0,0,-0.06],[4,-0.6,-0.42],[9,-3.4,-0.16],[10,-3.52,-0.1]];
function herm(K,t){
  if(t<=K[0][0])return K[0][1];
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t<=b[0]){const h=b[0]-a[0],s=(t-a[0])/h,s2=s*s,s3=s2*s;return(2*s3-3*s2+1)*a[1]+(s3-2*s2+s)*h*a[2]+(-2*s3+3*s2)*b[1]+(s3-s2)*h*b[2];}}
  const l=K[K.length-1];return l[1]+(t-l[0])*l[2];
}
function setCam(t){
  cam.y=herm(KY,t);cam.p=herm(KP,t);cam.z=herm(KZ,t);cam.x=0;
  cam.cp=Math.cos(cam.p);cam.sp=Math.sin(cam.p);
  const kick=t>3.95?Math.exp(-Math.max(0,t-3.98)*5)*sstep(3.95,3.99,t):0;
  cam.f=F0*(1+0.035*kick);
}
const P={x:0,y:0,z:0,k:0,ok:false};
function proj(x,y,z){
  const dx=x-cam.x,dy=y-cam.y,dz=z-cam.z;
  const yp=dy*cam.cp+dz*cam.sp, zp=dz*cam.cp-dy*cam.sp;
  P.z=zp; if(zp<0.08){P.ok=false;return P;}
  P.ok=true; const k=cam.f/zp; P.k=k; P.x=W/2+dx*k; P.y=H/2-yp*k; return P;
}
function unproj(sx,sy,zp){ // returns world point at camera-depth zp
  const dx=(sx-W/2)*zp/cam.f, yp=-(sy-H/2)*zp/cam.f;
  const dy=yp*cam.cp-zp*cam.sp, dz=yp*cam.sp+zp*cam.cp;
  return [cam.x+dx,cam.y+dy,cam.z+dz];
}

/* ============================================================
   TRANSITION WIPE  (red flash crossing the frame, slanted)
   ============================================================ */
const FL0=3.90,FL1=4.14,SLANT=0.35;
const flipU=(sx,sy)=>(sx-(sy-H/2)*SLANT)/W;
const flipTimeAt=(sx,sy)=>FL0+(FL1-FL0)*clamp((flipU(sx,sy)+0.4)/1.8);
const wipeU=t=>(t-FL0)/(FL1-FL0)*1.8-0.4;
function wipePath(c,t,left){
  const xw=wipeU(t)*W,xa=xw-H/2*SLANT,xb=xw+H/2*SLANT;
  c.beginPath();
  if(left){c.moveTo(-W,-10);c.lineTo(xa,-10);c.lineTo(xb,H+10);c.lineTo(-W,H+10);}
  else{c.moveTo(xa,-10);c.lineTo(2*W,-10);c.lineTo(2*W,H+10);c.lineTo(xb,H+10);}
  c.closePath();
}
function withWipe(c,t,fn){
  if(t<FL0){fn(c,0);return;}
  if(t>FL1+0.08){fn(c,1);return;}
  c.save();wipePath(c,t,false);c.clip();fn(c,0);c.restore();
  c.save();wipePath(c,t,true);c.clip();fn(c,1);c.restore();
}

/* ============================================================
   SPRITES
   ============================================================ */
function softSprite(col,size,hard){
  const s=mk(size,size),c=s.getContext('2d');
  const g=c.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,cs(col,1));g.addColorStop(hard||0.35,cs(col,0.55));g.addColorStop(1,cs(col,0));
  c.fillStyle=g;c.fillRect(0,0,size,size);return s;
}
const SPR_SMOKE_R=softSprite([120,22,16],128,0.25),SPR_SMOKE_D=softSprite([10,4,4],128,0.3);
const SPR_GLOW=softSprite([255,255,255],64,0.15);
const CONF=[['#f6c445',4],['#ffe39a',2],['#e0262b',3],['#fff4e2',2],['#ff3c8e',2],['#2ec5e6',1.5],['#43d17a',1],['#8d5cf6',1],['#ff8a2b',1.5]];
const CONF_F=[],CONF_B=[],CONF_W=[],BOKEH=[];
CONF.forEach(([h,w])=>{const c=hex(h);for(let i=0;i<w*2;i++)CONF_W.push(CONF_F.length);CONF_F.push(h);CONF_B.push(rgb(c[0]*0.62,c[1]*0.62,c[2]*0.62));BOKEH.push(softSprite(c,64,0.6));});
const pickConf=()=>CONF_W[(R()*CONF_W.length)|0];
const GRAIN=mk(256,256);{const g=GRAIN.getContext('2d'),id=g.createImageData(256,256);const r2=rng(5);for(let i=0;i<id.data.length;i+=4){const v=(r2()*255)|0;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255;}g.putImageData(id,0,0);}
const grainPat=ctx.createPattern(GRAIN,'repeat');

/* ============================================================
   CROWD
   ============================================================ */
const SKINS=[[226,180,150],[205,155,120],[182,128,96],[150,100,72],[122,82,60],[236,198,172],[198,142,106],[168,116,86]];
const HAIRC=[[30,22,18],[52,36,26],[84,58,36],[20,18,18],[112,80,50],[140,132,122],[64,42,30],[96,40,24]];
const COATS=[[60,56,52],[48,46,44],[70,60,48],[46,50,40],[74,66,58],[40,36,36],[58,48,40],[64,62,68],[52,40,36]];
const PANTS=[[40,38,36],[34,34,38],[52,46,40],[30,30,30],[44,42,36]];
const HATC=[[44,40,38],[36,34,34],[62,54,46],[72,24,22],[52,50,54],[30,30,34]];
const SCARFC=[[150,30,28],[72,62,56],[124,40,34],[92,82,72],[60,30,30]];
const PH_COLS=[[255,60,140],[250,196,60],[40,190,230],[232,40,52],[150,96,245],[60,210,120],[255,140,40]];
const BAL_COLS=[[230,28,40],[246,190,52],[255,70,150],[40,180,235],[255,236,200],[150,96,245],[255,140,40],[60,205,120]];
const BOOT=[34,28,26],FLAGRED=[210,22,26],CREAM=[240,226,204];
const PLAC_TXT=['¡FELIZ CUMPLE!','¡RICHI!','¡QUE VIVA RICHI!','¡SALUD!'];

const ROWZ=[];{let z=2.6,i=0;while(z<54){ROWZ.push(z);z+=1.32+i*0.115;i++;}}
const NR=ROWZ.length;
const TANH=Math.tan(FOV/2)*W/H;
const rows=[],people=[];
function makePerson(x,z,r){
  const hero=r===0&&Math.abs(x)<0.01;
  const fem=!hero&&R()<0.42;
  const p={x:x+(hero?0:rand(-0.06,0.06)),z:z+(hero?0:rand(-0.1,0.1)),row:r,hero,fem,
    h:hero?1.8:(fem?rand(1.6,1.74):rand(1.7,1.9)),
    skin:pick(SKINS),hairC:pick(HAIRC),coat:pick(COATS),pants:pick(PANTS),
    long:R()<0.55,tall:R()<0.5,neck:R()<0.35,neckC:pick([[150,24,22],[40,36,34],[120,20,20],[200,190,170]]),
    phase:rand(-0.025,0.025),jumper:R()<0.62,jf:rand(1.8,2.4),jph:R()*TAU,jh:rand(0.16,0.3),wf:rand(5,8),
    role:'march',fistSide:R()<0.75?1:-1,party:pick(['cheer','cheer','clap','wave','cup']),waveSide:R()<0.5?1:-1,
    partyHat:hero||R()<0.62,hatCol:pick(PH_COLS),hatCol2:pick([[255,244,214],[252,206,80],[255,255,255]]),hatTilt:rand(-0.25,0.25),
    mus:!fem&&R()<0.3,brow:rand(0.011,0.016),seed:R()*100,dir:x<0?-1:1,plac:(R()*PLAC_TXT.length)|0,
    faceW:rand(0.92,1.08),eyeOpen:R()<0.45,tFlip:4,glasses:R()<0.12,jaw:fem?rand(0.36,0.46):rand(0.44,0.62)};
  p.stub=!fem&&!p.mus&&R()<0.3;
  p.hw=hero?'cap':fem?pick(['scarf','scarf','long','beret','long','bun','curly','ushanka']):pick(['cap','cap','short','side','curly','beret','bald','short','ushanka','side']);
  p.hwC=p.hw==='scarf'?pick(SCARFC):p.hw==='ushanka'?pick([[70,56,44],[52,44,38],[90,78,66],[40,36,34]]):pick(HATC);
  p.bal=[0,1,2,3,4,5].map(i=>i%2?pick(BAL_COLS):BAL_COLS[i===0?0:1]);
  if(hero){p.glasses=false;p.stub=false;p.jaw=0.5;p.eyeOpen=true;p.skin=SKINS[1];p.hatCol=[250,196,60];p.hatCol2=[230,40,52];p.role='fist';p.fistSide=1;p.coat=[62,56,50];p.neck=true;p.neckC=[150,24,22];}
  return p;
}
for(let r=0;r<NR;r++){
  const z=ROWZ[r],maxX=(z+3.7)*TANH+1.8,off=(r%2)?0.52:0,row={z,people:[]};
  const n=Math.ceil(maxX/1.04)+1;
  for(let c=-n;c<=n;c++){const x0=c*1.04+off;if(Math.abs(x0)>maxX)continue;const p=makePerson(x0,z,r);row.people.push(p);people.push(p);}
  row.people.sort((a,b)=>Math.abs(a.x)-Math.abs(b.x));
  rows.push(row);
}
// symmetric flag bearers
const FLAGROWS={1:[0.52],3:[2.6,6.2],5:[1.6,4.7,8.4],7:[3.2,7.4],10:[1.6,5.2,9.8],13:[3.8,8.6,13.5],16:[2.2,7.2,12.5,18]};
for(const r in FLAGROWS){if(!rows[r])continue;for(const tx of FLAGROWS[r])for(const s of[-1,1]){let best=null,bd=1e9;for(const p of rows[r].people){const d=Math.abs(p.x-s*tx);if(d<bd&&p.role==='march'){bd=d;best=p;}}if(best&&bd<0.7){best.role='flag';best.dir=s;}}}
for(const p of people){
  if(p.role!=='march'||p.hero)continue;
  if(p.row>=2&&Math.abs(p.x)>0.6&&R()<0.1)p.role='placard';
  else if(R()<0.36)p.role='fist';
}
for(const p of people){if(p.role==='fist'&&p.party!=='cup'&&R()<0.6)p.party='cup';}
const hero=people.find(p=>p.hero);

/* ============================================================
   ATMOSPHERE (analytic)
   ============================================================ */
const smoke=[],embers=[];
for(let i=0;i<120;i++){const z=lerp(2.5,48,Math.pow(R(),1.4));const hw=(z+3)*TANH+2;
  smoke.push({kind:'smoke',x0:rand(-hw,hw),y0:R()<0.8?rand(0.05,1.8):rand(2.2,4.5),z,r:rand(1.4,3.4)*(0.7+z/40),vx:rand(-0.18,0.18),ph:R()*TAU,lit:R()<0.45,a:rand(0.35,0.8),tFlip:4});}
for(let i=0;i<26;i++){const z=rand(1.2,4.5);smoke.push({kind:'smoke',x0:rand(-2.2,2.2),y0:rand(0,0.5),z,r:rand(1.0,1.9),vx:rand(-0.12,0.12),ph:R()*TAU,lit:R()<0.5,a:rand(0.4,0.8),tFlip:4});}
for(let i=0;i<340;i++){const z=lerp(1.6,34,Math.pow(R(),1.2));const hw=(z+3)*TANH+1;
  embers.push({kind:'ember',x0:rand(-hw,hw),y0:rand(0,6.5),z,vy:rand(0.05,0.28),sz:rand(0.006,0.016),ph:R()*TAU,tFlip:4});}
const smokePos=(s,t,o)=>{o[0]=s.x0+s.vx*t+0.25*Math.sin(t*0.3+s.ph);o[1]=s.y0+0.06*Math.sin(t*0.5+s.ph);o[2]=s.z;return o;};
const emberPos=(e,t,o)=>{o[0]=e.x0+0.12*Math.sin(t*0.7+e.ph);o[1]=((e.y0+e.vy*t)%6.5);o[2]=e.z;return o;};
const TMP=[0,0,0];

/* fireworks schedule (analytic, background) */
const FIREWORKS=[];
[[4.55,-18,36],[5.15,22,40],[5.8,-6,46],[6.6,14,34],[6.75,-24,42],[7.4,4,50],[8.05,-14,38],[8.25,20,46],[8.4,0,54],[8.9,-26,48],[9.3,26,40]].forEach(([t0,x,y])=>{
  const col=pick([[255,214,110],[255,90,150],[90,210,255],[255,255,240],[255,150,60],[170,120,255]]);const n=110,sp=[];
  for(let i=0;i<n;i++){const a=R()*TAU,b=Math.acos(rand(-1,1)),v=rand(13,17);sp.push([Math.cos(a)*Math.sin(b)*v,Math.cos(b)*v,Math.sin(a)*Math.sin(b)*v*0.3,R()]);}
  FIREWORKS.push({t0,x,y,z:170,col,sp,col2:pick([[255,255,255],[255,230,160]])});
});

/* ============================================================
   BACKGROUND ARCHITECTURE
   ============================================================ */
const BLD=[];
function addB(x,z,w,h,type){const b={x,z,w,h,type,win:[]};
  const cols=Math.floor(w/2.4),rws=Math.floor((h-4)/3.4);
  for(let i=0;i<cols;i++)for(let j=0;j<rws;j++)b.win.push([x-w/2+1.2+i*2.4,3+j*3.4,R(),R(),pick([[255,206,120],[255,180,90],[255,226,170],[255,140,170],[160,220,255]])]);
  BLD.push(b);return b;}
[-1,1].forEach(s=>{addB(s*118,135,44,30,'ribs');addB(s*74,118,34,44,'grid');addB(s*36,104,30,34,'ribs');addB(s*19,88,11,21,'block');});
addB(0,122,26,46,'tower');
BLD.sort((a,b)=>b.z-a.z);
const TOWER=BLD.find(b=>b.type==='tower');

/* ============================================================
   TITLE LAYOUTS
   ============================================================ */
let TL=null,BL=null,TITLE_PTS=[];
function lineW(c,s,size,sp){c.font=`${size}px Anton`;c.letterSpacing=(sp*size)+'px';const w=c.measureText(s).width-sp*size;c.letterSpacing='0px';return w;}
function layout(){
  const c=cT;c.font='100px Anton';
  const ascE=c.measureText('E').actualBoundingBoxAscent/100;
  const ascN=c.measureText('Ñ').actualBoundingBoxAscent/100;
  const lines=VERT?['EL 2 DE','OCTUBRE','NO SE OLVIDA']:['EL 2 DE OCTUBRE','NO SE OLVIDA'];
  const maxW=VERT?W*0.84:W*0.72,maxH=VERT?H*0.118:H*0.2;
  const L=lines.map(s=>({s,size:Math.min(100*maxW/lineW(c,s,100,0.035),maxH)}));
  let tot=0;L.forEach((l,i)=>{tot+=l.size*ascE+(i?l.size*0.2:0);});
  let y=H*(VERT?0.47:0.5)-tot/2;
  L.forEach((l,i)=>{if(i)y+=l.size*0.2;y+=l.size*ascE;l.y=y;l.asc=ascE*l.size;});
  TL=L;
  // birthday
  const A='¡¡CUMPLEAÑOS',B='DE',C='RICHI!!';
  const aw=VERT?W*0.9:W*0.56,cw=VERT?W*0.82:W*0.5;
  const sA=Math.min(100*aw/lineW(c,A,100,0.02),VERT?H*0.095:H*0.13);
  const sC=Math.min(100*cw/lineW(c,C,100,0.02),VERT?H*0.16:H*0.22);
  const sB=sA*0.5;

}

function drawCloth(c,p,t,m,fz,shrink,rr){
  const dir=p.dir,N=14,Wf=1.55*shrink,top=3.22,hg=1.0*(0.4+0.6*shrink),phs=t*3.1+p.seed;
  const xs=[],ty=[],by=[],sd=[];
  for(let i=0;i<=N;i++){const s=i/N,a=phs-s*4.4,wv=Math.sin(a)*0.11*(0.2+s);xs.push(dir*s*Wf);ty.push(top+wv);by.push(top-hg+wv*1.15-s*0.07);sd.push(Math.cos(a));}
  for(let i=0;i<N;i++){const kk=(1.8+3.2*Math.max(rr,0.45))*(0.72+0.36*sd[i]);c.fillStyle=lightCol(FLAGRED,lerp(kk,1.3+0.3*sd[i],m),m,fz*0.55);
    c.beginPath();c.moveTo(xs[i],ty[i]);c.lineTo(xs[i+1]+dir*0.008,ty[i+1]);c.lineTo(xs[i+1]+dir*0.008,by[i+1]);c.lineTo(xs[i],by[i]);c.closePath();c.fill();}
  if(shrink>0.5){c.fillStyle=lightCol([240,190,80],lerp(0.8+1.6*rr,1.2,m),m,fz);star(c,dir*0.3*shrink,ty[3]-0.24,0.11,0.045,5,Math.PI/2);c.fill();}
}
function drawBalloon(c,x,y,r,col,fz){
  if(r<=0.001)return;
  const g=c.createRadialGradient(x-r*0.35,y+r*0.45,r*0.08,x,y,r*1.15);
  g.addColorStop(0,'rgba(255,255,255,0.95)');g.addColorStop(0.18,lightCol(col,1.15,1,fz));g.addColorStop(0.75,lightCol(col,0.85,1,fz));g.addColorStop(1,lightCol(col,0.45,1,fz));
  c.fillStyle=g;ell(c,x,y,r,r*1.16);c.fill();
  c.fillStyle=lightCol(col,0.6,1,fz);c.beginPath();c.moveTo(x,y-r*1.12);c.lineTo(x-r*0.12,y-r*1.28);c.lineTo(x+r*0.12,y-r*1.28);c.closePath();c.fill();
}
function drawPlacard(c,p,t,m,fz,pb,rr){

  if(!after){
    c.fillStyle=lightCol([200,22,24],0.9+2.4*rr,m,fz);c.fillRect(-48,-31,96,62);

    c.fillStyle=lightCol(CREAM,0.7+1.8*rr,m,fz);c.font='34px Anton';c.textAlign='center';c.textBaseline='middle';c.fillText('10·IX',14,4);

function drawTier(c,cx,y0,w,h,ry,cl,drips){
  const x0=cx-w/2,x1=cx+w/2;
  const g=c.createLinearGradient(x0,0,x1,0);g.addColorStop(0,cl.bL);g.addColorStop(0.35,cl.b);g.addColorStop(1,cl.bS);
  c.fillStyle=g;c.beginPath();c.moveTo(x0,y0+h);c.lineTo(x0,y0);c.ellipse(cx,y0,w/2,ry,0,Math.PI,TAU);c.lineTo(x1,y0+h);c.ellipse(cx,y0+h,w/2,ry,0,0,Math.PI,true);c.closePath();c.fill();
  // ribbon band
  const bb=y0+h*0.12,bh=h*0.13;const g2=c.createLinearGradient(x0,0,x1,0);g2.addColorStop(0,'#fff0b0');g2.addColorStop(0.3,'#e9b23a');g2.addColorStop(1,'#8a5a10');
  c.fillStyle=g2;c.beginPath();c.moveTo(x0,bb+bh);c.lineTo(x0,bb);c.ellipse(cx,bb,w/2,ry,0,Math.PI,TAU);c.lineTo(x1,bb+bh);c.ellipse(cx,bb+bh,w/2,ry,0,0,Math.PI,true);c.closePath();c.fill();
  // top
  c.fillStyle=cl.top;ell(c,cx,y0+h,w/2,ry);c.fill();
  // drips
  c.fillStyle=cl.f;c.beginPath();c.ellipse(cx,y0+h,w/2,ry,0,Math.PI,TAU);
  const n=drips.length,dw=w/n*0.32;
  for(let i=n-1;i>=0;i--){const xi=x0+(i+0.5)/n*w,ye=y0+h-ry*Math.sqrt(Math.max(0,1-sq((xi-cx)/(w/2)))),db=ye-0.025-drips[i]*h*0.42;
    c.lineTo(xi+dw,ye-0.025);c.lineTo(xi+dw,db+dw);c.quadraticCurveTo(xi+dw,db,xi,db);c.quadraticCurveTo(xi-dw,db,xi-dw,db+dw);c.lineTo(xi-dw,ye-0.025);}
  c.lineTo(x0,y0+h);c.closePath();c.fill();
  // pearls
  c.fillStyle='#fffaf0';for(let i=1;i<12;i++){const a=Math.PI+i/12*Math.PI;ell(c,cx+Math.cos(a)*w/2*0.98,y0+Math.sin(a)*ry+0.025,w*0.016,w*0.016);c.fill();}
}

const CK_CRM={bL:'#fffaf2',b:'#f6e6d2',bS:'#8a7060',top:'#fffaf4',f:'#e8142e'};
function candles(c,cx,ytop,w,ry,n,t,hcol){

}

  c.strokeStyle='#d9a63a';c.lineWidth=0.012;c.beginPath();c.moveTo(0,0.82);c.lineTo(0,0.98);c.stroke();

function drawBunting(c,t,z,y0,span,sag,seed){
  const d=eOutBack(clamp((t-4.08-seed*0.12)/0.7));if(d<=0)return;
  const yo=(1-d)*5;c.setTransform(1,0,0,1,0,0);
  const n=Math.round(span*2/0.62),pts=[];
  for(let i=0;i<=n;i++){const x=-span+i*span*2/n,y=y0+yo-sag*(1-sq(x/span));proj(x,y,z);pts.push([P.x,P.y,x,y]);}
  c.strokeStyle='rgba(255,236,200,0.55)';c.lineWidth=Math.max(1,P.k*0.015);c.beginPath();pts.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();
  for(let i=0;i<n;i++){const a=pts[i],b=pts[i+1];const fl=0.06*Math.sin(t*5+i*0.9);
    proj((a[2]+b[2])/2+fl,(a[3]+b[3])/2-0.48,z);
    c.fillStyle=CONF_F[[0,2,3,4,5,8,6][(i+seed)%7]];c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(P.x,P.y);c.closePath();c.fill();}
}

function drawEnt(c,e,t){
  switch(e.kind){
  case'conf':{proj(e.x,e.y,e.z);if(!P.ok)return;const s=P.k*e.sz;if(s<0.35||P.x<-50||P.x>W+50||P.y<-50||P.y>H+50)return;
    if(e.land){const sq2=clamp((cam.y)/P.z+cam.p,0.05,1);c.setTransform(Math.cos(e.rot)*s,Math.sin(e.rot)*s*sq2,-Math.sin(e.rot)*s*e.ar,Math.cos(e.rot)*s*e.ar*sq2,P.x,P.y);c.fillStyle=CONF_B[e.ci];c.fillRect(-1,-1,2,2);return;}
    if(P.z<1.5&&s>10){c.setTransform(1,0,0,1,0,0);const r=s*2.2;c.globalAlpha=0.55;c.drawImage(BOKEH[e.ci],P.x-r,P.y-r,2*r,2*r);c.globalAlpha=1;return;}
    const cr=Math.cos(e.rot),sr=Math.sin(e.rot),f=Math.cos(e.fl);
    c.setTransform(cr*s,sr*s,-sr*s*f*e.ar,cr*s*f*e.ar,P.x,P.y);
    c.fillStyle=Math.abs(f)>0.96&&(e.ci<2)?'#fffbe8':(f>0?CONF_F[e.ci]:CONF_B[e.ci]);c.fillRect(-1,-1,2,2);return;}
  case'strm':{const vx=e.vx,vy=e.vy,vz=e.vz,vl=Math.hypot(vx,vy,vz)+0.001;let dx=-vx/vl,dy=-vy/vl+0.8,dz=-vz/vl;const dl=Math.hypot(dx,dy,dz);dx/=dl;dy/=dl;dz/=dl;
    if(e.land){dx=1;dy=0;dz=0.3;}
    c.setTransform(1,0,0,1,0,0);c.beginPath();let ok=false,kk=0;
    for(let i=0;i<=10;i++){const a=i/10*e.len,cu=Math.sin(e.ph+i*0.95+t*3)*e.curl*(0.3+i/10);proj(e.x+dx*a+cu,e.y+dy*a+(e.land?0:Math.cos(e.ph+i)*0.03),e.z+dz*a+cu*0.5);if(!P.ok)continue;kk=P.k;ok?c.lineTo(P.x,P.y):c.moveTo(P.x,P.y);ok=true;}
    if(!ok)return;c.strokeStyle=CONF_F[e.ci];c.lineWidth=Math.max(0.6,kk*0.02);c.lineCap='round';c.lineJoin='round';c.stroke();return;}
  case'ball':{if(t<e.t0)return;proj(e.x,e.y,e.z);if(!P.ok)return;const k=P.k;const fz=(1-Math.exp(-P.z/62))*0.5;c.setTransform(k,0,0,-k,P.x,P.y);
    c.strokeStyle='rgba(255,240,220,0.45)';c.lineWidth=0.006;c.beginPath();c.moveTo(0,-0.2);c.quadraticCurveTo(0.06*Math.sin(t*2+e.ph),-0.6,-0.03,-1.0);c.stroke();
    drawBalloon(c,0,0,0.17,BAL_COLS[e.ci],fz);return;}

function parts(s){const i=s.indexOf('10');if(i<0)return[{t:s,red:false}];const a=[];if(i>0)a.push({t:s.slice(0,i),red:false});a.push({t:'10',red:true});if(i+2<s.length)a.push({t:s.slice(i+2),red:false});return a;}
function drawMonoLine(c,s,cx,y,size,sp,alpha){
  const P2=parts(s);c.font=`${size}px Anton`;c.letterSpacing=(sp*size)+'px';c.textAlign='left';c.textBaseline='alphabetic';
  const ws=P2.map(p=>c.measureText(p.t).width);const tot=ws.reduce((a,b)=>a+b,0)-sp*size;let x0=cx-tot/2;
  const d=size*0.075,n=Math.max(6,Math.round(d/(1.6*PX)));
  c.globalAlpha=alpha;
  for(let j=n;j>=1;j--){const f=j/n;c.fillStyle=rgb(lerp(120,30,f),lerp(10,2,f),lerp(10,3,f));let x=x0;P2.forEach((p,i)=>{c.fillText(p.t,x+f*d*0.55,y+f*d);x+=ws[i];});}
  let x=x0;const gC=c.createLinearGradient(0,y-size*0.8,0,y);gC.addColorStop(0,'#fff8ea');gC.addColorStop(1,'#d6c3a2');
  const gR=c.createLinearGradient(0,y-size*0.8,0,y);gR.addColorStop(0,'#ff3a2c');gR.addColorStop(1,'#a10e0b');
  P2.forEach((p,i)=>{c.fillStyle=p.red?gR:gC;c.fillText(p.t,x,y);x+=ws[i];});
  c.globalAlpha=1;c.letterSpacing='0px';
  return tot;
}
function renderTitle(c,t){

    if(b===0){tone(t,B*0.9,ch[0],{type:'triangle',gain:0.3,a:0.004,rel:0.05,lp:500});tone(t,B*0.9,ch[0]*2,{type:'sine',gain:0.1,rel:0.05});
      tone(t,0.22,120,{f2:45,decay:true,gain:0.5});noise(t,0.015,{type:'highpass',f:3000,gain:0.08});}
    else{for(const f of ch[1])tone(t,B*0.55,f,{type:'sawtooth',gain:0.022,a:0.004,rel:0.04,lp:1900,lpEnv:1.6,lpT:0.08,room:0.3,pan:b===1?-0.3:0.3});
      noise(t,0.11,{type:'bandpass',f:1900,q:0.8,gain:0.1,room:0.4});}
    noise(t+B*0.5,0.03,{type:'highpass',f:7500,gain:0.045,pan:0.4});noise(t,0.04,{type:'highpass',f:6500,gain:0.03,pan:-0.4});}
  });
  // pickup drum fill
  for(let i=0;i<4;i++)noise(T0+i*B*0.25,0.08,{type:'bandpass',f:1700,gain:0.08+i*0.02,room:0.4});
  // final chord swell
  {const tf=T0+22*B;for(const f of[N.G2,N.D3,N.G3,N.B3,N.D4,N.G4])for(const d of[-6,6])tone(tf,DUR-tf-0.25,f,{type:'sawtooth',gain:0.016,a:0.06,rel:0.2,lp:2200,detune:d,hall:0.3,vib:3});
    tone(tf,0.6,110,{f2:40,decay:true,gain:0.4});noise(tf,1.8,{type:'highpass',f:4500,gain:0.16,hall:0.4});}
  /* ---------- EVENT SFX ---------- */
  // cake appears
  pop(5.1,0,0.3);[N.G5,N.B5,N.D6,N.G6].forEach((f,i)=>tone(5.13+i*0.05,0.7,f,{gain:0.05,decay:true,hall:0.5,pan:-0.2+i*0.15}));
  // cake arrives with the hero
  for(let i=0;i<12;i++)tone(6.95+i*0.03,0.4,arand(2400,5200),{gain:0.02,decay:true,hall:0.5,pan:arand(-0.6,0.6)});
  // RICHI slam + cannons
  noise(6.38,0.18,{type:'bandpass',f:600,f2:5000,q:1,gain:0.22,a:0.16});
  tone(6.55,0.9,90,{f2:32,fT:0.4,decay:true,gain:0.65});noise(6.55,2.0,{type:'highpass',f:4200,gain:0.22,hall:0.4});
  for(const f of[N.G3,N.B3,N.D4,N.G4])for(const d of[-8,8])tone(6.55,0.55,f,{type:'sawtooth',gain:0.03,a:0.01,rel:0.25,lp:3000,lpEnv:1.5,detune:d,hall:0.4});
  for(const s of[-1,1]){noise(6.55,0.4,{f:1400,gain:0.3,pan:s*0.8,room:0.4});tone(6.55,0.3,160,{f2:45,decay:true,gain:0.25,pan:s*0.8});for(let i=0;i<10;i++)noise(6.6+arand(0,0.6),0.02,{type:'highpass',f:3500,gain:0.04,pan:s*0.7});}
  // finale
  {const tf=8.62;noise(tf-0.2,0.22,{type:'bandpass',f:500,f2:6000,q:1,gain:0.22,a:0.19});tone(tf,1.2,80,{f2:28,fT:0.5,decay:true,gain:0.7});noise(tf,2.0,{type:'highpass',f:4000,gain:0.25,hall:0.45});
    for(const s of[-1,1])noise(tf,0.45,{f:1300,gain:0.3,pan:s*0.8,room:0.4});for(let i=0;i<14;i++)pop(tf+arand(0,0.6),arand(-0.9,0.9),arand(0.08,0.16));}
  // fireworks (distant boom + crackle)
  for(const f of FIREWORKS){const pan=clamp(f.x/30,-0.9,0.9);tone(f.t0+0.05,0.8,arand(55,70),{f2:30,decay:true,gain:0.14,hall:0.5,pan});noise(f.t0+0.05,0.5,{f:500,gain:0.08,hall:0.5,pan});
    for(let i=0;i<16;i++)noise(f.t0+0.35+arand(0,0.9),0.018,{type:'highpass',f:arand(3000,6000),gain:arand(0.01,0.03),pan:pan+arand(-0.3,0.3),hall:0.3});}
  // sparkler fizz under the cake
  noise(5.3,DUR-5.3,{type:'highpass',f:6000,gain:0.012,a:0.5,hold:DUR-6.2,room:0.2});
  const buf=await oc.startRendering();AUDIO_BUF=buf;return buf;
  })();
  return audioPromise;
}

/* ============================================================
   RENDER
   ============================================================ */
const bins=[];for(let i=0;i<=NR;i++)bins.push([]);
function binIdx(z){let lo=0,hi=NR;while(lo<hi){const mid=(lo+hi)>>1;if(ROWZ[mid]<z)lo=mid+1;else hi=mid;}return lo;}
function layerOfZ(zp){return zp>15.5?0:zp>8.5?1:2;}
function vignette(c,strength){const g=c.createRadialGradient(W/2,H*0.48,Math.min(W,H)*0.25,W/2,H/2,Math.hypot(W,H)*0.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${strength})`);c.fillStyle=g;c.fillRect(0,0,W,H);}

function render(t,fi){
  setCam(t);
  for(const b of bins)b.length=0;
  if(t<FL1+0.4)for(const s of smoke){smokePos(s,t,TMP);bins[binIdx(TMP[2])].push(s);}
  for(const e of embers)bins[binIdx(e.z)].push(e);
  cakeAt(t);CAKE_ITEM.z=CK.z;for(const it of ITEMS)if(t>4.05)bins[binIdx(it.z)].push(it);
  for(const a of[balls,strm,conf,sparks])for(const e of a)bins[binIdx(e.z)].push(e);

  // background layer
  cBG.setTransform(1,0,0,1,0,0);
  withWipe(cBG,t,(c,m)=>drawBG(c,m,t));
  ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  ctx.filter=`blur(${(3.2*PX).toFixed(2)}px)`;ctx.drawImage(LBG,0,0);ctx.filter='none';
  withWipe(ctx,t,(c,m)=>drawGround(c,m,t));

  // crowd layers
  const LC=[cFAR,cMID,ctx];
  for(let L=0;L<3;L++){
    const c=LC[L];if(L<2){c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);}
    for(let r=NR-1;r>=0;r--){
      const lz=layerOfZ(ROWZ[r]-cam.z);if(lz!==L)continue;
      const b=bins[r+1];for(const e of b)drawEnt(c,e,t);
      for(const p of rows[r].people)drawPerson(c,p,t);
    }
    if(L===2){for(const e of bins[0])drawEnt(c,e,t);}
    c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
    if(L<2){ctx.setTransform(1,0,0,1,0,0);ctx.filter=`blur(${((L===0?2.2:0.9)*PX).toFixed(2)}px)`;ctx.drawImage(L===0?LFAR:LMID,0,0);ctx.filter='none';
      // atmospheric fog between depth layers
      withWipe(ctx,t,(c2,m)=>{c2.setTransform(1,0,0,1,0,0);proj(0,0,6000);const hz=P.y;const g=c2.createLinearGradient(0,hz-H*0.25,0,H);
        if(!m){g.addColorStop(0,'rgba(40,6,6,0)');g.addColorStop(0.35,`rgba(46,8,7,${L===0?0.42:0.25})`);g.addColorStop(1,`rgba(20,3,3,${L===0?0.25:0.12})`);}
        else{g.addColorStop(0,'rgba(255,150,120,0)');g.addColorStop(0.4,`rgba(255,160,130,${L===0?0.08:0.04})`);g.addColorStop(1,'rgba(0,0,0,0)');}
        c2.fillStyle=g;c2.fillRect(0,0,W,H);});
    }
  }
  ctx.setTransform(1,0,0,1,0,0);
  withWipe(ctx,t,(c,m)=>drawLights(c,m,t));

  // TITLE 1
  if(t<4.0){renderTitle(cT,t);const pre=sstep(3.8,4.0,t);ctx.save();
    ctx.translate(W/2,H/2);ctx.scale(1+0.035*pre+0.01*t/4,1+0.035*pre+0.01*t/4);ctx.translate(-W/2,-H/2);
    ctx.shadowColor='rgba(170,10,6,0.55)';ctx.shadowBlur=40*PX;ctx.drawImage(TCAN,0,0);ctx.restore();}
  // TITLE 2
  if(t>=6.25){renderBday(cB,t);ctx.save();ctx.shadowColor='rgba(255,170,60,0.45)';ctx.shadowBlur=46*PX;ctx.drawImage(BCAN,0,0);ctx.restore();drawSparkles(ctx,t);}

  // FLASH
  if(t>FL0-0.06&&t<FL1+0.4){
    const xw=wipeU(t)*W;ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.translate(xw,H/2);ctx.transform(1,0,SLANT,1,0,0);
    const bw=W*0.22;const g=ctx.createLinearGradient(-bw,0,bw*0.5,0);g.addColorStop(0,'rgba(255,0,0,0)');g.addColorStop(0.55,'rgba(255,30,20,0.85)');g.addColorStop(0.8,'rgba(255,240,230,1)');g.addColorStop(0.92,'rgba(255,60,40,0.6)');g.addColorStop(1,'rgba(255,0,0,0)');
    if(t<FL1+0.05){ctx.fillStyle=g;ctx.fillRect(-bw,-H,bw*1.5,2*H);}
    ctx.restore();
    const fa=Math.exp(-Math.max(0,t-4.0)*9)*sstep(3.9,4.0,t);
    ctx.globalCompositeOperation='lighter';ctx.fillStyle=`rgba(255,40,24,${(0.45*fa).toFixed(3)})`;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=`rgba(255,230,210,${(0.22*fa).toFixed(3)})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  }

  // POST: bloom, grade, vignette, grain
  const gm=sstep(3.95,4.2,t);
  cBL.setTransform(1,0,0,1,0,0);cBL.globalCompositeOperation='copy';cBL.filter=`brightness(${lerp(1.2,0.95,gm)}) contrast(${lerp(2.6,2.2,gm)}) blur(${(3.5*PX).toFixed(2)}px)`;
  cBL.drawImage(cv,0,0,BLM.width,BLM.height);cBL.filter='none';cBL.globalCompositeOperation='source-over';
  ctx.globalCompositeOperation='screen';ctx.globalAlpha=lerp(0.55,0.5,gm);ctx.drawImage(BLM,0,0,W,H);ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  vignette(ctx,lerp(0.82,0.5,gm));
  if(t<0.9){ctx.fillStyle=`rgba(0,0,0,${(1-sstep(0,0.9,t)).toFixed(3)})`;ctx.fillRect(0,0,W,H);}
  ctx.globalCompositeOperation='overlay';ctx.globalAlpha=0.07;fi=fi||0;ctx.setTransform(1,0,0,1,(fi*97)%256,(fi*61+13)%256);ctx.fillStyle=grainPat;ctx.fillRect(-256,-256,W+512,H+512);
  ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}

/* ============================================================
   INIT + PLAYBACK + EXPORT
   ============================================================ */
function computeFlipTimes(){
  setCam(4.02);
  for(const p of people){proj(p.x,1.5,p.z);p.tFlip=P.ok?flipTimeAt(P.x,P.y):4.0;}
  for(const s of smoke){smokePos(s,4.0,TMP);proj(TMP[0],TMP[1],TMP[2]);s.tFlip=P.ok?flipTimeAt(P.x,P.y):4.0;}
  for(const e of embers){emberPos(e,4.0,TMP);proj(TMP[0],TMP[1],TMP[2]);e.tFlip=P.ok?flipTimeAt(P.x,P.y):4.0;}
}
const ui=document.getElementById('ui'),btnPlay=document.getElementById('play'),btnExp=document.getElementById('exp'),prog=document.getElementById('prog'),hint=document.getElementById('hint');
btnExp.textContent=`Exportar MP4 · ${W}×${H} · 60 fps`;
let started=false,playing=false,exporting=false,muted=Q.has('mute');
let t0=0,actx=null,src=null,aStart=0;
function showUI(v){ui.style.opacity=v?1:0;ui.style.pointerEvents=v?'auto':'none';}
function nowT(){
  if(actx&&src&&!muted)return Math.max(0,actx.currentTime-aStart-(actx.outputLatency||0));
  return (performance.now()-t0)/1000;
}
async function play(){
  if(exporting)return;
  resetSim();playing=true;showUI(false);hint.style.opacity=0;
  if(!muted&&AUDIO_BUF){
    try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:A_SR});await actx.resume();
      if(src){try{src.stop();}catch(e){}}
      src=actx.createBufferSource();src.buffer=AUDIO_BUF;src.connect(actx.destination);aStart=actx.currentTime+0.08;src.start(aStart);}catch(e){src=null;}
  }else{src=null;}
  t0=performance.now()+80;
}
function frame(){
  if(exporting){return;}
  let t=FREEZE!==null?FREEZE:(playing?nowT():0);
  if(playing&&t>DUR){t=DUR;if(LOOP&&nowT()>DUR+1.2){play();}else if(!LOOP){playing=false;showUI(true);hint.style.opacity=0.75;}}
  if(!playing&&FREEZE===null)t=started?Math.min(DUR,lastT):3.3;
  lastT=t;
  if(simT>t+0.001)resetSim();
  advanceTo(t);render(t,Math.round(t*60));
  if(FREEZE!==null){document.title='ready';return;}
  requestAnimationFrame(frame);
}
let lastT=0;
btnPlay.addEventListener('click',e=>{e.stopPropagation();started=true;play();});
btnExp.addEventListener('click',e=>{e.stopPropagation();exportMP4();});
addEventListener('click',()=>{if(started&&!exporting&&playing)play();});
addEventListener('keydown',e=>{if(exporting)return;const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();started=true;play();}
  if(k==='m'){muted=!muted;if(muted&&src){try{src.stop();}catch(_){}src=null;t0=performance.now()-lastT*1000;}}
  if(k==='e')exportMP4();
  if(k==='a'){const q=new URLSearchParams(location.search);q.set('aspect',VERT?'16x9':'9x16');location.search=q.toString();}
});

function loadMuxer(){
  if(window.Mp4Muxer)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.min.js';s.onload=res;s.onerror=()=>rej(new Error('No se pudo cargar mp4-muxer (¿sin internet?)'));document.head.appendChild(s);});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function exportMP4(){
  if(exporting)return;
  if(!('VideoEncoder' in window)){alert('Este navegador no soporta WebCodecs. Usa Chrome o Edge actualizados.');return;}
  exporting=true;playing=false;if(src){try{src.stop();}catch(e){}src=null;}
  showUI(true);btnPlay.disabled=btnExp.disabled=true;prog.textContent='Preparando…';
  try{
    await loadMuxer();
    const FPS=60,NF=Math.round(DUR*FPS);
    let vcfg=null;
    for(const codec of['avc1.640034','avc1.640033','avc1.64002A','avc1.4D0034','avc1.42E034']){
      for(const hw of['prefer-hardware','no-preference','prefer-software']){
        const cfg={codec,width:W,height:H,bitrate:Math.round(34e6*(W*H)/(1080*1920)),framerate:FPS,bitrateMode:'variable',latencyMode:'quality',hardwareAcceleration:hw,avc:{format:'avc'}};
        try{const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported){vcfg=cfg;break;}}catch(e){}
      }if(vcfg)break;}
    if(!vcfg)throw new Error('El navegador no puede codificar H.264 a esta resolución.');
    const buf=muted?null:await buildAudio();
    let acfg=null,acodec=null;
    if(buf&&'AudioEncoder' in window){
      for(const [codec,name] of[['mp4a.40.2','aac'],['opus','opus']]){const cfg={codec,sampleRate:A_SR,numberOfChannels:2,bitrate:192000};
        try{const r=await AudioEncoder.isConfigSupported(cfg);if(r.supported){acfg=cfg;acodec=name;break;}}catch(e){}}
    }
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:'avc',width:W,height:H,frameRate:FPS},
      audio:acfg?{codec:acodec,numberOfChannels:2,sampleRate:A_SR}:undefined,fastStart:'in-memory',firstTimestampBehavior:'offset'});
    let encErr=null;
    if(acfg){
      const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>encErr=e});aenc.configure(acfg);
      const L=buf.getChannelData(0),Rr=buf.getChannelData(1),total=Math.round(DUR*A_SR),CH=2048;
      for(let off=0;off<total;off+=CH){const n=Math.min(CH,total-off),d=new Float32Array(n*2);d.set(L.subarray(off,off+n),0);d.set(Rr.subarray(off,off+n),n);
        const ad=new AudioData({format:'f32-planar',sampleRate:A_SR,numberOfFrames:n,numberOfChannels:2,timestamp:Math.round(off*1e6/A_SR),data:d});aenc.encode(ad);ad.close();}
      await aenc.flush();aenc.close();
    }
    const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>encErr=e});venc.configure(vcfg);
    resetSim();const tStart=performance.now();
    for(let i=0;i<NF;i++){
      if(encErr)throw encErr;
      const t=i/FPS;advanceTo(t);render(t,i);
      const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/FPS),duration:Math.round(1e6/FPS)});
      venc.encode(vf,{keyFrame:i%60===0});vf.close();
      while(venc.encodeQueueSize>6)await sleep(2);
      if(i%3===0){const el=(performance.now()-tStart)/1000,eta=el/(i+1)*(NF-i-1);prog.textContent=`Exportando cuadro ${i+1}/${NF} · faltan ~${Math.ceil(eta)} s`;await sleep(0);}
    }
    await venc.flush();venc.close();if(encErr)throw encErr;
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    const name=`cumpleanos-richi-${W}x${H}-60fps.mp4`;
    window.__exportBlob=blob;window.__exportName=name;
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);if(!Q.has('autoexport'))a.click();
    prog.textContent=`Listo: ${name} (${(blob.size/1048576).toFixed(1)} MB${acfg?'':' · sin audio'})`;
    window.__exportDone='ok';
  }catch(err){console.error(err);prog.textContent='Error al exportar: '+(err&&err.message||err);window.__exportDone='error: '+(err&&err.message||err);}
  exporting=false;btnPlay.disabled=btnExp.disabled=false;started=true;lastT=DUR;requestAnimationFrame(frame);
}
async function start(){
  try{await document.fonts.load('100px Anton','EL10ÑÁ¡!');}catch(e){}
  layout();sampleTitle();computeFlipTimes();resetSim();
  if(FREEZE===null){prog.textContent='Generando audio…';btnPlay.disabled=true;
    try{await buildAudio();}catch(e){console.warn(e);}prog.textContent=AUDIO_BUF?'':'Audio no disponible';btnPlay.disabled=false;showUI(true);}
  else showUI(false);
  requestAnimationFrame(frame);
  if(Q.has('autoexport'))exportMP4();
}
start();
})();
</script>
